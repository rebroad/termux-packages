name: Build and stage ReBroad Termux packages

on:
  push:
    branches: [master]
    paths:
      - packages/*/build.sh
      - scripts/rebroad-upstream-packages.json
      - scripts/rebroad-publish-apt.sh
      - .github/workflows/rebroad-packages-apt.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      packages:
        description: Comma-separated package names to publish; empty selects all manifest packages
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rebroad-apt-publish
  cancel-in-progress: false

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      package_names: ${{ steps.select-packages.outputs.package_names }}
    steps:
      - name: Check out Termux package definitions
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Select packages for this run
        id: select-packages
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          manifest = json.load(open("scripts/rebroad-upstream-packages.json", encoding="utf-8"))
          available = [package["name"] for package in manifest["packages"]]
          requested = os.environ["REQUESTED_PACKAGES"].strip()
          if requested:
              selected = [name.strip() for name in requested.split(",") if name.strip()]
          elif os.environ["EVENT_NAME"] == "push":
              before = os.environ["BEFORE_SHA"]
              after = os.environ["HEAD_SHA"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", before, after, "--", "packages"], text=True
              ).splitlines()
              selected = [
                  parts[1]
                  for path in changed
                  if (parts := path.split("/"))
                  and len(parts) == 3
                  and parts[0] == "packages"
                  and parts[2] == "build.sh"
              ]
          else:
              selected = available

          if len(selected) != len(set(selected)):
              raise SystemExit("Duplicate package name requested")
          unknown = set(selected) - set(available)
          if unknown:
              raise SystemExit(f"Packages missing from manifest: {', '.join(sorted(unknown))}")
          ordered = [name for name in available if name in selected]
          print(f"Selected packages: {', '.join(ordered) if ordered else '(none)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_names={','.join(ordered)}\n")
          PY

      - name: Build matching Termux container with Android NDK r29
        if: steps.select-packages.outputs.package_names != ''
        run: docker build --tag ghcr.io/termux/package-builder:latest scripts/

      - name: Build and validate all listed packages
        if: steps.select-packages.outputs.package_names != ''
        shell: bash
        env:
          PACKAGE_NAMES: ${{ steps.select-packages.outputs.package_names }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a packages <<< "$PACKAGE_NAMES"
          mkdir -p dist
          for package in "${packages[@]}"; do
            ./scripts/lint-packages.sh "packages/$package/build.sh"
            ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 "$package"
          done
          for output_dir in output termux-packages/output; do
            [[ -d "$output_dir" ]] || continue
            for package in "${packages[@]}"; do
              find "$output_dir" -maxdepth 2 -type f -name "${package}_*_aarch64.deb" -exec cp -v -t dist/ {} +
            done
          done
          shopt -s nullglob
          for package in "${packages[@]}"; do
            debs=(dist/"${package}"_*_aarch64.deb)
            [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one aarch64 ${package} deb" >&2; exit 1; }
            pkg="${debs[0]}"
            [[ "$(dpkg-deb --field "$pkg" Package)" == "$package" ]]
            [[ "$(dpkg-deb --field "$pkg" Architecture)" == aarch64 ]]
            expected_version=$(sed -nE 's/^TERMUX_PKG_VERSION="?([^"]+)"?$/\1/p' "packages/$package/build.sh")
            actual_version=$(dpkg-deb --field "$pkg" Version)
            [[ "$actual_version" == "$expected_version" || "$actual_version" == "$expected_version-0" ]] || {
              echo "Unexpected $package version: $actual_version (recipe: $expected_version)" >&2
              exit 1
            }
          done
          sha256sum dist/*.deb

      - name: Save native Termux packages for staging
        if: steps.select-packages.outputs.package_names != ''
        uses: actions/upload-artifact@v4
        with:
          name: rebroad-termux-aarch64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  stage-apt:
    needs: [build-aarch64]
    if: needs.build-aarch64.outputs.package_names != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the existing APT feed
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-feed

      - name: Check out the package manifest
        uses: actions/checkout@v4
        with:
          ref: master
          path: package-recipes

      - name: Download native Termux packages
        uses: actions/download-artifact@v4
        with:
          name: rebroad-termux-aarch64
          path: package

      - name: Stage every listed package in the APT pool
        working-directory: apt-feed
        shell: bash
        env:
          PACKAGE_NAMES: ${{ needs.build-aarch64.outputs.package_names }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a packages <<< "$PACKAGE_NAMES"
          for package in "${packages[@]}"; do
            shopt -s nullglob
            debs=("${GITHUB_WORKSPACE}/package/${package}"_*_aarch64.deb)
            [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one ${package} package" >&2; exit 1; }
            [[ "$(dpkg-deb --field "${debs[0]}" Package)" == "$package" ]]
            [[ "$(dpkg-deb --field "${debs[0]}" Architecture)" == aarch64 ]]
            first_letter="${package:0:1}"
            pool="pool/main/$first_letter/$package"
            mkdir -p "$pool"
            rm -f "$pool"/"${package}"_*_aarch64.deb
            cp -- "${debs[0]}" "$pool/"
          done

      - name: Regenerate and sign the APT index
        working-directory: apt-feed
        env:
          PACKAGE_DIR: ${{ github.workspace }}/package
          PACKAGE_MANIFEST: ${{ github.workspace }}/package-recipes/scripts/rebroad-upstream-packages.json
          PACKAGE_NAMES: ${{ needs.build-aarch64.outputs.package_names }}
          REBROAD_APT_GPG_PRIVATE_KEY: ${{ secrets.REBROAD_APT_GPG_PRIVATE_KEY }}
          REBROAD_APT_GPG_PASSPHRASE: ${{ secrets.REBROAD_APT_GPG_PASSPHRASE }}
        run: bash ../package-recipes/scripts/rebroad-publish-apt.sh

      - name: Commit package binaries and signed APT index
        working-directory: apt-feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pool/main dists/stable
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage ReBroad Termux package updates"
          git push origin HEAD:apt-repo
