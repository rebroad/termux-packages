name: ReBroad Termux APT build and stage

on:
  push:
    branches: [master]
    paths:
      - packages/sccache/build.sh
      - packages/htop/build.sh
      - .github/workflows/rebroad-sccache-apt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Termux package definitions
        uses: actions/checkout@v4

      - name: Build matching Termux container with Android NDK r29
        shell: bash
        run: docker build --tag ghcr.io/termux/package-builder:latest scripts/

      - name: Lint sccache recipe
        run: ./scripts/lint-packages.sh packages/sccache/build.sh

      - name: Lint htop recipe
        run: ./scripts/lint-packages.sh packages/htop/build.sh

      - name: Build sccache for native Termux aarch64
        run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 sccache

      - name: Build htop for native Termux aarch64
        run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 htop

      - name: Collect and validate Debian packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for output_dir in output termux-packages/output; do
            [[ -d "$output_dir" ]] || continue
            find "$output_dir" -maxdepth 2 -type f \( -name 'sccache_*_aarch64.deb' -o -name 'htop_*_aarch64.deb' \) -exec cp -v -t dist/ {} +
          done
          shopt -s nullglob
          for package in sccache htop; do
            debs=(dist/"${package}"_*_aarch64.deb)
            [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one aarch64 ${package} deb" >&2; exit 1; }
            [[ "$(dpkg-deb --field "${debs[0]}" Package)" == "$package" ]]
            [[ "$(dpkg-deb --field "${debs[0]}" Architecture)" == aarch64 ]]
          done
          [[ "$(dpkg-deb --field dist/sccache_0.19.0+rebroad1_aarch64.deb Version)" == "0.19.0+rebroad1" ]]
          [[ "$(dpkg-deb --field dist/htop_3.6.0-dev+rebroad1_aarch64.deb Version)" == "3.6.0-dev+rebroad1" ]]
          sha256sum dist/*.deb

      - name: Save native Termux packages for staging
        uses: actions/upload-artifact@v4
        with:
          name: rebroad-termux-aarch64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  stage-apt:
    needs: [build-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the existing APT feed
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-feed

      - name: Download native Termux packages
        uses: actions/download-artifact@v4
        with:
          name: rebroad-termux-aarch64
          path: package

      - name: Stage binaries in the APT pool
        working-directory: apt-feed
        shell: bash
        run: |
          set -euo pipefail
          for package in sccache htop; do
            shopt -s nullglob
            debs=("${GITHUB_WORKSPACE}/package/${package}"_*_aarch64.deb)
            [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one ${package} package" >&2; exit 1; }
            [[ "$(dpkg-deb --field "${debs[0]}" Package)" == "$package" ]]
            [[ "$(dpkg-deb --field "${debs[0]}" Architecture)" == aarch64 ]]
            first_letter="${package:0:1}"
            pool="pool/main/$first_letter/$package"
            mkdir -p "$pool"
            rm -f "$pool"/"${package}"_*_aarch64.deb
            cp -- "${debs[0]}" "$pool/"
          done

      - name: Commit staged package binaries
        working-directory: apt-feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pool/main/s/sccache pool/main/h/htop
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage ReBroad sccache and htop ARM64 binaries"
          git push origin HEAD:apt-repo
