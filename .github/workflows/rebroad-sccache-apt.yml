name: ReBroad sccache APT build and publish

on:
  push:
    branches: [master]
    paths:
      - packages/sccache/build.sh
      - scripts/rebroad-publish-apt.sh
      - .github/workflows/rebroad-sccache-apt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Termux package definitions
        uses: actions/checkout@v4

      - name: Build ReBroad sccache for native Termux aarch64
        shell: bash
        run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 sccache

      - name: Collect and validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find output termux-packages/output -maxdepth 2 -type f -name 'sccache_*_aarch64.deb' -exec cp -v -t dist/ {} + 2>/dev/null || true
          shopt -s nullglob
          debs=(dist/sccache_*_aarch64.deb)
          [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one aarch64 sccache deb" >&2; exit 1; }
          [[ "$(dpkg-deb --field "${debs[0]}" Package)" == sccache ]]
          [[ "$(dpkg-deb --field "${debs[0]}" Architecture)" == aarch64 ]]
          [[ "$(dpkg-deb --field "${debs[0]}" Version)" == "0.18.0+rebroad1" ]]
          sha256sum "${debs[0]}"

      - name: Save native Termux sccache DEB
        uses: actions/upload-artifact@v4
        with:
          name: rebroad-sccache-aarch64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-apt:
    needs: [build-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Detect separately configured archive signing secrets
        id: signing
        shell: bash
        env:
          APT_PRIVATE_KEY: ${{ secrets.REBROAD_APT_GPG_PRIVATE_KEY }}
          APT_PASSPHRASE: ${{ secrets.REBROAD_APT_GPG_PASSPHRASE }}
        run: |
          if [[ -n "$APT_PRIVATE_KEY" && -n "$APT_PASSPHRASE" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Native DEB built; publishing awaits REBROAD_APT_GPG_PRIVATE_KEY and REBROAD_APT_GPG_PASSPHRASE secrets."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out signed APT feed
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-feed
          persist-credentials: true

      - name: Download native Termux sccache
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rebroad-sccache-aarch64
          path: package

      - name: Generate and sign APT package index
        if: steps.signing.outputs.ready == 'true'
        working-directory: apt-feed
        env:
          REBROAD_APT_GPG_PRIVATE_KEY: ${{ secrets.REBROAD_APT_GPG_PRIVATE_KEY }}
          REBROAD_APT_GPG_PASSPHRASE: ${{ secrets.REBROAD_APT_GPG_PASSPHRASE }}
          PACKAGE_DIR: ${{ github.workspace }}/package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev gnupg
          bash <(curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/rebroad/termux-packages/master/scripts/rebroad-publish-apt.sh")
      - name: Publish APT feed
        if: steps.signing.outputs.ready == 'true'
        working-directory: apt-feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dists pool
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish signed ReBroad sccache aarch64 package from ${GITHUB_SHA:0:12}"
          git push origin HEAD:apt-repo
