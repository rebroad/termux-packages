name: Refresh ReBroad package sources

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out package recipes
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update tracked upstream commits
        run: python3 scripts/rebroad-update-upstreams.py

      - name: Build and validate changed packages before publishing
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(git diff --name-only -- packages/ x11-packages/ | awk -F/ '($1 == "packages" || $1 == "x11-packages") && $3 == "build.sh" {print $2}' | sort -u)
          (("${#packages[@]}" > 0)) || exit 0
          docker build --tag ghcr.io/termux/package-builder:latest scripts/
          mkdir -p dist
          for package in "${packages[@]}"; do
            recipe="packages/$package/build.sh"
            [[ -f "$recipe" ]] || recipe="x11-packages/$package/build.sh"
            [[ -f "$recipe" ]] || { echo "Missing recipe for $package" >&2; exit 1; }
            ./scripts/lint-packages.sh "$recipe"
            ./scripts/run-docker.sh -d ./build-package.sh -f -I -C -w -a aarch64 "$package"
            shopt -s nullglob
            debs=(output/"${package}"_*_aarch64.deb)
            [[ "${#debs[@]}" -eq 1 ]] || { echo "Expected one built ${package} package" >&2; exit 1; }
            pkg="${debs[0]}"
            [[ "$(dpkg-deb --field "$pkg" Package)" == "$package" ]]
            [[ "$(dpkg-deb --field "$pkg" Architecture)" == aarch64 ]]
            expected_version=$(sed -nE 's/^TERMUX_PKG_VERSION="?([^"]+)"?$/\1/p' "$recipe")
            expected_revision=$(sed -nE 's/^TERMUX_PKG_REVISION="?([^"]+)"?$/\1/p' "$recipe")
            if [[ -n "$expected_revision" ]]; then
              expected_version="${expected_version}-${expected_revision}"
            fi
            actual_version=$(dpkg-deb --field "$pkg" Version)
            [[ "$actual_version" == "$expected_version" || ( -z "$expected_revision" && "$actual_version" == "$expected_version-0" ) ]] || {
              echo "Unexpected $package version: $actual_version (recipe: $expected_version)" >&2
              exit 1
            }
            cp -- "$pkg" dist/
          done
          sha256sum dist/*.deb

      - name: Commit validated recipe updates
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/ x11-packages/ scripts/rebroad-upstream-packages.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ x11-packages/ scripts/rebroad-upstream-packages.json
          git commit -m "Refresh ReBroad package sources"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start package build and APT publication
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=rebroad-packages-updated
