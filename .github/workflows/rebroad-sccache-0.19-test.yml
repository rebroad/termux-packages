name: Validate in-process sccache 0.19.0 on native Termux ARM64

on:
  push:
    branches: [test-sccache-0.19]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout ReBroad Termux packages
        uses: actions/checkout@v4
      - name: Lint ReBroad sccache recipe
        run: ./scripts/lint-packages.sh packages/sccache/build.sh
      - name: Build matching Termux package-builder image with Android NDK
        run: docker build --tag ghcr.io/termux/package-builder:latest scripts/
      - name: Build native Android ARM64 sccache 0.19.0+rebroad1
        run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 sccache
      - name: Validate built .deb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find output termux-packages/output -maxdepth 2 -type f -name 'sccache_*_aarch64.deb' -exec cp -v -t dist/ {} + 2>/dev/null || true
          shopt -s nullglob
          debs=(dist/sccache_*_aarch64.deb)
          [[ "${#debs[@]}" -eq 1 ]]
          pkg="${debs[0]}"
          [[ "$(dpkg-deb -f "$pkg" Package)" == 'sccache' ]]
          [[ "$(dpkg-deb -f "$pkg" Version)" == '0.19.0+rebroad1' ]]
          [[ "$(dpkg-deb -f "$pkg" Architecture)" == 'aarch64' ]]
          mkdir -p extracted
          dpkg-deb -x "$pkg" extracted
          readelf -l extracted/data/data/com.termux/files/usr/bin/sccache | grep -Fq '/system/bin/linker64'
          sha256sum "$pkg"
      - name: Save verified native .deb
        uses: actions/upload-artifact@v4
        with:
          name: rebroad-sccache-0.19.0-aarch64
          path: dist/*.deb
          retention-days: 30
          if-no-files-found: error
